services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: agenda-barbearia-db
    environment:
      POSTGRES_DB: agenda_barbearia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
